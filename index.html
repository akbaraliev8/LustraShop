<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Lamp Shop</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .neon {
            text-shadow: 0 0 20px #00ffcc, 0 0 30px #00ffcc, 0 0 40px #ff00ff;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
        }

        input {
            background: #222;
            color: #fff;
            border: 1px solid #00ffcc;
        }

        button {
            background: #00ffcc;
            color: #111;
            cursor: pointer;
        }

        .animated {
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px #00ffcc; }
            100% { box-shadow: 0 0 20px #00ffcc; }
        }
    </style>
</head>
<body>
    <h1 class="neon">Welcome to the Neon Lamp Shop!</h1>

    <div>
        <h2>Login / Registration</h2>
        <form id="auth-form">
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="animated">Login / Register</button>
        </form>
    </div>

    <div>
        <h2>Product Catalog</h2>
        <ul>
            <li>Lamp 1 - $50</li>
            <li>Lamp 2 - $75</li>
            <li>Lamp 3 - $100</li>
        </ul>
    </div>

    <div>
        <h2>Shopping Cart</h2>
        <p>No items in your cart.</p>
    </div>

    <div>
        <h2>Checkout</h2>
        <button class="animated">Proceed to Checkout</button>
    </div>
</body>
</html>
